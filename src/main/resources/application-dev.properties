# ===== DEV — H2 in-memory =====

# Mock downstream endpoints (served by MockDownstreamController on the same port)
institution.creditor-agent-url=http://localhost:81460/mock/credit
institution.avs-url=http://localhost:81460/mock/avs
institution.status-url=http://localhost:81460/mock/status
institution.return-url=http://localhost:81460/mock/return

spring.datasource.url=jdbc:h2:mem:capitaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
